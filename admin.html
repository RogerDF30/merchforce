<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchforce Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2316192b'/><text x='50' y='68' font-size='55' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'>M</text></svg>">
</head>
<body>

<!-- lock screen -->
<div id="lock">
  <div class="lockbox">
    <div class="logo" style="margin-bottom:14px"><span class="mark" style="background:var(--ink)">M</span> Merchforce Admin</div>
    <h2>Supplier console</h2>
    <p>Enter the admin key to continue.</p>
    <div class="field"><label>Admin key</label><input id="adminKey" type="password" autocomplete="current-password"></div>
    <div class="form-err" id="lockErr"></div>
    <button class="btn primary" id="unlockBtn" style="width:100%;justify-content:center">Unlock</button>
  </div>
</div>

<!-- console -->
<div id="console" hidden>
  <header class="hdr">
    <div class="wrap hdr-in">
      <a class="logo" href="admin.html"><span class="mark" style="background:var(--ink)">M</span> Merchforce <small>ADMIN</small></a>
      <div class="hdr-spacer"></div>
      <a class="btn small" href="./" target="_blank">View storefront ↗</a>
      <button class="btn small" id="lockNow">Lock</button>
    </div>
  </header>
  <nav class="tabs wrap" id="tabs">
    <button class="tab on" data-t="requests">Requests</button>
    <button class="tab" data-t="catalog">Catalog</button>
    <button class="tab" data-t="brands">Brands</button>
    <button class="tab" data-t="users">Users</button>
    <button class="tab" data-t="analytics">Analytics</button>
    <button class="tab" data-t="settings">Settings</button>
  </nav>
  <main class="wrap">
    <section class="panel" id="p-requests"><div class="spin"></div></section>
    <section class="panel" id="p-catalog" hidden></section>
    <section class="panel" id="p-brands" hidden></section>
    <section class="panel" id="p-users" hidden></section>
    <section class="panel" id="p-analytics" hidden></section>
    <section class="panel" id="p-settings" hidden></section>
  </main>
</div>

<!-- edit modal -->
<div class="overlay" id="mOverlay" hidden>
  <div class="modal" style="max-width:680px">
    <button class="close" id="mClose">✕</button>
    <div id="mBody" style="padding:26px"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/js/admin.js?v=4"></script>
</body>
</html>
